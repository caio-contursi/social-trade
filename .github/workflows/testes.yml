name: Testes automatizados

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API com PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOCIALTRADE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialtrade_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socialtrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialtrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testar API com cobertura
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/api-coverage.xml --cov-fail-under=90 --junitxml=reports/api-junit.xml
      - name: Salvar relatórios da API
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-postgresql
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Componentes e contratos do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Testar frontend com cobertura
        run: npm run test:coverage
      - name: Salvar cobertura do frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Navegador desktop e mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOCIALTRADE_TEST_PYTHON: python
      SOCIALTRADE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialtrade_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socialtrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialtrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar API
        run: python -m pip install -r requirements.txt
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium de teste
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Testar fluxos completos
        working-directory: frontend
        run: npm run test:e2e
      - name: Salvar relatório, traces e capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
